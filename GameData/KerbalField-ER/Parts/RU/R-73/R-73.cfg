PART
{
    // Kerbal Space Program - Part Config

    // --- general parameters ---
    name = kferR-73
    module = Part
    author = BahamutoD, Cypher

    // --- asset parameters ---
    mesh = R-73.mu
    rescaleFactor = 1

    // --- node definitions ---
	NODE {
		name = top
		transform = node0
		size = 0
		method = FIXED_JOINT
		crossfeed = True
		rigid = False
	}
	NODE {
		name = butt
		transform = node1
		size = 0
		method = FIXED_JOINT
		crossfeed = True
		rigid = False
	}

    // --- editor parameters ---
    TechRequired = precisionEngineering
    entryCost = 1400
    cost = 1200
    category = none
    bdacategory = Missiles
    subcategory = 0
    bulkheadProfiles = srf
    title = #autoLOC_R-73_title
    manufacturer = #autoLOC_kbfer_chunk
    description = #autoLOC_R-73_description
	tags = CCK-KBF
    
    // attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
    attachRules = 1,1,0,0,1
    

    // --- standard part parameters ---
    mass = 0.105
    dragModelType = default
    maximum_drag = 0.01
    minimum_drag = 0.01
    angularDrag = 2
    crashTolerance = 10
    maxTemp = 3600


    MODULE
    {
        name = MissileLauncher

        shortName = R-74M

        thrust = 22 //KN thrust during boost phase
        cruiseThrust = 12 //thrust during cruise phase
        dropTime = 0.1 //how many seconds after release until engine ignites
        boostTime = 3.5 //seconds of boost phase
        cruiseTime = 30 //seconds of cruise phase
        guidanceActive = true //missile has guidanceActive
        maxTurnRateDPS = 45 //degrees per second
        decoupleSpeed = 5
        decoupleForward = false

        audioClipPath = BDArmory/Sounds/rocketLoop
        exhaustPrefabPath = BDArmory/Models/exhaust/smallExhaust
        boostExhaustPrefabPath = BDArmory/Models/exhaust/mediumExhaust
        boostExhaustTransformName = boostTransform
        boostTransformName = boostTransform

        optimumAirspeed = 900

        aero = true
        liftArea = 0.002
        steerMult = 4
        maxTorque = 35
        maxAoA = 55
        //aeroSteerDamping = 4.5
        torqueRampUp = 50

        engineFailureRate = 0.05   // Probability the missile engine will fail to start (0-1), evaluated once on missile launch
	guidanceFailureRate = 0  // Probability the missile guidance will fail per second (0-1), evaluated every frame after launch

        homingType = aam
        missileType = missile
        targetingType = heat
        heatThreshold = 2.5   // Distance-adjusted heat of target in order to be detected by missile, lower value results in better detection range
        frontAspectHeatModifier = 1 
        maxOffBoresight = 270 //maximum angle, from the boresight, that the missile can track the target. This also controls how the missile can launch off boresight. When launched from the air at another air target with uncagedLock = false, launch off boresight is at 0.35*maxOffBoresight, otherwise it is at 0.75*,maxOffBoresight (uncagedLock = true OR either launching craft or target is landed/splashed).
		uncagedLock = true // true: Allows missile to be cued to a radar target, also controls launch conditions, see above
        // allAspect = false // DEPRECATED - use uncagedLock instead
        targetCoM = false // if true: target CoM instead of hottest part
        lockedSensorFOV = 6 // How much the seeker can see in the direction it is looking (in terms of angle cone).
        flareEffectivity = 0.9 // Modifies how the missile targeting is affected by flares, 1 is fully affected (normal behavior), lower values mean less affected (0 is ignores flares), higher values means more affected. This is a simple multiplier for flares, use the locked sensor bias curves for more sophisticated flare rejection behavior.

        minStaticLaunchRange = 0
        maxStaticLaunchRange = 20000

        engageAir = true
        engageMissile = false
        engageGround = false
        engageSLW = false

    }
    MODULE
    {
        name = BDExplosivePart
        tntMass = 8
        warheadType = ContinuousRod
        fuseFailureRate = 0	// How often the explosive fuse will fail to detonate (0-1), evaluated once on detonation trigger
    }
}
