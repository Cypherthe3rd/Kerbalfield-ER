PART
{
    // Kerbal Space Program - Part Config

    // --- general parameters ---
    name = kfer_MIM146missile
    module = Part
    author = BahamutoD

    // --- asset parameters ---
    mesh = MIM146.mu
    rescaleFactor = 1

    // --- node definitions ---
	NODE {
		name = top
		transform = node0
		size = 0
		method = FIXED_JOINT
		crossfeed = True
		rigid = False
	}
	NODE {
		name = butt
		transform = node1
		size = 0
		method = FIXED_JOINT
		crossfeed = True
		rigid = False
	}

    // --- editor parameters ---
    TechRequired = precisionEngineering
    entryCost = 1400
    cost = 1200
    category = none
    bdacategory = Missiles
    subcategory = 0
    bulkheadProfiles = srf
    title = #autoLOC_MIM146missile_title
    manufacturer = #autoLOC_kbfer_chunk
    description = #autoLOC_MIM146missile_description
	tags = CCK-KBF
    
    // attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
    attachRules = 1,1,0,0,1

    // --- standard part parameters ---
    mass = 0.051
    dragModelType = default
    maximum_drag = 0.01
    minimum_drag = 0.01
    angularDrag = 2
    crashTolerance = 20
    maxTemp = 3600


    MODULE
    {
        name = MissileLauncher

        shortName = MIM-146

        thrust = 20 //KN thrust during boost phase
        cruiseThrust = 2 //thrust during cruise phase
        dropTime = 0 //how many seconds after release until engine ignites
        boostTime = 5 //seconds of boost phase
        cruiseTime = 30 //seconds of cruise phase
        guidanceActive = true //missile has guidanceActive
        maxTurnRateDPS = 35 //degrees per second
        decoupleSpeed = 5
        decoupleForward = true

        audioClipPath = BDArmory/Sounds/rocketLoop
        exhaustPrefabPath = BDArmory/Models/exhaust/smallExhaust
        boostExhaustPrefabPath = BDArmory/Models/exhaust/mediumExhaust
        boostExhaustTransformName = boostTransform
        boostTransformName = boostTransform

        optimumAirspeed = 1000

        aero = true
        liftArea = 0.003
        steerMult = 4
        maxTorque = 20
	maxAoA = 20
	//aeroSteerDamping = 4.5
	torqueRampUp = 50

	homingType = aam
	missileType = missile
	targetingType = laser
	maxOffBoresight = 70 
	uncagedLock = false // true: Allows missile to be cued to a radar target, also controls launch conditions, see above
        lockedSensorFOV = 6 // How much the seeker can see in the direction it is looking (in terms of angle cone).

        minStaticLaunchRange = 0
        maxStaticLaunchRange = 10000

        engageAir = true
        engageMissile = false
        engageGround = true
        engageSLW = false
    }
	MODULE
	{
        name = BDExplosivePart
        tntMass = 12
        warheadType = ShapedCharge
        caliber = 152
        apmod = 0.56
	}
	MODULE
	{
        name = BDExplosivePart
        tntMass = 7
        warheadType = ContinuousRod
	}
    MODULE
	{
		name = ModulePartVariants
		baseVariant = Standard
		useMultipleDragCubes = false
		VARIANT
		{
			name = Standard
			displayName = Standard
			themeName = Standard
			primaryColor = #ffffff
			secondaryColor = #000000
			TEXTURE
			{
				mainTextureURL = KerbalField-ER/Parts/US/MIM-146/MIM146
			}		
		}
	}
}
